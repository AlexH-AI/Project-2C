name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Docs-only PRs skip CI entirely (ADR-0015).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    # Docs-only pushes to main skip CI too (ADR-0015, Actions minutes addendum).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint, typecheck, unit, boundaries)
    # main only receives PRs that already passed Verify, so a push to main skips it.
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: E2E (web build, Microsoft Edge)
        run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build-exe:
    name: Build portable exe
    needs: verify
    # main pushes, manual runs, and PRs labelled build-exe (ADR-0015, Actions minutes addendum).
    # Runs when verify passed or was skipped (push to main).
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'build-exe'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:exe
      - uses: actions/upload-artifact@v7
        with:
          name: Project-2C-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/project2c.exe
          if-no-files-found: error
