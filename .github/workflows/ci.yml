name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Docs-only PRs skip CI entirely (ADR-0015).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    # Docs-only pushes to main skip CI too (ADR-0015, Actions minutes addendum).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# A new push to a PR cancels that PR's older run. Runs on main never cancel each
# other, so every merged commit keeps its exe artifact: each gets its own group
# (per SHA), because GitHub also drops an older *pending* run in a shared group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify (lint, typecheck, unit, boundaries)
    # main only receives PRs that already passed Verify, so a push to main skips it.
    if: github.event_name != 'push'
    runs-on: windows-latest
    outputs:
      build-exe: ${{ steps.labels.outputs.build-exe }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: E2E (web build, Microsoft Edge)
        run: pnpm e2e
      # Current labels, not the event payload: `gh pr create --label build-exe` opens
      # the PR before adding the label, so the `opened` payload has none (T-063, #119).
      # No `labeled` trigger: a run per label would add skipped checks that hide this
      # run's result in the PR check list.
      - name: Read PR labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $labels = gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) { throw "gh api failed ($LASTEXITCODE)" }
          $buildExe = (@($labels) -contains 'build-exe').ToString().ToLower()
          "build-exe=$buildExe" >> $env:GITHUB_OUTPUT
          "PR labels: $($labels -join ', ') -> build-exe=$buildExe"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build-exe:
    name: Build portable exe
    needs: verify
    # main pushes, manual runs, and PRs labelled build-exe (ADR-0015, Actions minutes addendum).
    # Runs when verify passed or was skipped (push to main).
    if: >-
      !failure() && !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.verify.outputs.build-exe == 'true')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # New key so the cache is saved again with the debug build of clippy/tests;
          # an exact hit on the old release-only cache would never be re-saved.
          key: rust-checks
      # Rust checks run before the exe build; `pnpm verify` has none because
      # office machines may lack Rust (local equivalent: `pnpm verify:rust`).
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --lib --tests --locked -- -D warnings
      - name: Rust unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:exe
      - uses: actions/upload-artifact@v7
        with:
          name: Project-2C-${{ github.sha }}
          path: apps/desktop/src-tauri/target/release/project2c.exe
          if-no-files-found: error
