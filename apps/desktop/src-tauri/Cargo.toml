[package]
name = "project2c"
version = "0.1.0"
description = "Project-2C desktop app"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "project2c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
