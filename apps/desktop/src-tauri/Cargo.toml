[package]
name = "project2c"
version = "0.1.0"
description = "Project-2C desktop app"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "project2c_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# AI commands only (ADR-0009 D-1, ADR-0005 appendix); the file commands stay on `std` (ADR-0016).
keyring-core = "=1.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ureq = "=3.4.2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
